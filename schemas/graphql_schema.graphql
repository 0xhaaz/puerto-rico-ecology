# =====================================================
# QUERY ROOT
# =====================================================

type Query {
  # Species queries
  species(id: UUID!): Species
  speciesList(
    limit: Int
    offset: Int
    endemicStatus: EndemicStatus
    conservationStatus: ConservationStatus
    culturalSignificance: CulturalSignificance
    nftReady: Boolean
    searchTerm: String
  ): [Species!]!
  speciesCount(
    endemicStatus: EndemicStatus
    conservationStatus: ConservationStatus
  ): Int!
  speciesNearLocation(
    latitude: Float!
    longitude: Float!
    radiusKm: Float!
  ): [Species!]!
  endangeredSpecies: [Species!]!
  endemicSpecies: [Species!]!

  # Population data
  populationTrend(speciesId: UUID!): [PopulationTrendData!]!

  # Ecosystem queries
  ecosystem(id: UUID!): Ecosystem
  ecosystemsList(
    limit: Int
    offset: Int
    ecosystemType: EcosystemType
    protectionStatus: ProtectionStatus
  ): [Ecosystem!]!

  # Observations
  observation(id: UUID!): Observation
  recentObservations(days: Int): [Observation!]!
  observationsBySpecies(speciesId: UUID!): [Observation!]!

  # Cultural knowledge (respects FPIC and access controls)
  culturalKnowledge(id: UUID!): CulturalKnowledge
  publicCulturalKnowledge(
    knowledgeType: KnowledgeType
    culturalSignificance: CulturalSignificance
  ): [CulturalKnowledge!]!

  # Conservation
  conservationActions(
    actionType: ActionType
    ongoing: Boolean
  ): [ConservationAction!]!
  invasiveSpeciesList: [InvasiveSpecies!]!
  threatenedSpeciesWithHabitats: [Species!]!

  # Justice framework
  environmentalJusticeCommunities(
    sacrificeZone: Boolean
    municipality: String
  ): [EnvironmentalJusticeCommunity!]!
  sacrificeZones: [EnvironmentalJusticeCommunity!]!
  foodSystems(municipality: String): [FoodSystem!]!
  economicEcologyMetrics(
    category: String
    municipality: String
  ): [EconomicEcology!]!
  rightsOfNatureProposals(status: String): [RightsOfNatureProposal!]!

  # Web3
  nftMetadata(speciesId: UUID!): NFTMetadata
  nftReadySpecies: [Species!]!
  conservationRewardsByWallet(walletAddress: String!): [ConservationReward!]!
  daoProposals(
    status: String
    proposalType: String
  ): [DAOProposal!]!
  activeProposals: [DAOProposal!]!

  # Research & Education
  researchProjects(
    projectType: String
    status: String
  ): [ResearchProject!]!
  educationalResources(
    audience: String
    resourceType: String
    language: String
  ): [EducationalResource!]!

  # Statistics
  biodiversityStats: BiodiversityStats!
}

type BiodiversityStats {
  totalSpecies: Int!
  endemicSpecies: Int!
  criticallyEndangeredSpecies: Int!
  endangeredSpecies: Int!
  vulnerableSpecies: Int!
  totalObservations: Int!
  verifiedObservations: Int!
  conservationActionsActive: Int!
  ecosystemsProtected: Int!
  sacrificeZones: Int!
  communitiesOrganizing: Int!
}

# =====================================================
# MUTATION ROOT
# =====================================================

type Mutation {
  # Species observation submission
  submitObservation(input: ObservationInput!): Observation!
  verifyObservation(id: UUID!, verifiedBy: String!): Observation!

  # Conservation actions
  createConservationAction(input: ConservationActionInput!): ConservationAction!
  updateConservationAction(id: UUID!, input: ConservationActionInput!): ConservationAction!

  # Cultural knowledge (requires FPIC compliance)
  submitCulturalKnowledge(input: CulturalKnowledgeInput!): CulturalKnowledge!
  updateCulturalKnowledgeAccess(id: UUID!, publicAccess: Boolean!): CulturalKnowledge!

  # DAO proposals
  createProposal(input: ProposalInput!): DAOProposal!
  voteOnProposal(proposalId: UUID!, vote: VoteType!, voterAddress: String!): DAOProposal!
  executeProposal(proposalId: UUID!): DAOProposal!

  # Conservation rewards
  claimReward(
    walletAddress: String!
    actionType: String!
    actionDescription: String!
    relatedEntityId: UUID
  ): ConservationReward!

  # NFT minting
  mintSpeciesNFT(speciesId: UUID!, ownerAddress: String!): NFTMetadata!
}

# =====================================================
# INPUT TYPES
# =====================================================

input ObservationInput {
  speciesId: UUID!
  latitude: Float!
  longitude: Float!
  observationDate: Date!
  observationTime: String
  observerName: String
  observerEmail: String
  individualCount: Int
  lifeStage: LifeStage
  sex: Sex
  behaviorObserved: String
  hasPhoto: Boolean
  hasAudio: Boolean
  mediaUrls: [String!]
  projectName: String
  observationPlatform: String
}

input ConservationActionInput {
  actionName: String!
  actionType: ActionType!
  targetSpeciesIds: [UUID!]!
  targetEcosystemIds: [UUID!]
  implementingOrganization: String
  partnerOrganizations: [String!]
  communityInvolvement: Boolean
  indigenousLeadership: Boolean
  startDate: Date
  endDate: Date
  ongoing: Boolean
  totalBudgetUsd: Float
  fundingSources: [String!]
  projectUrl: String
}

input CulturalKnowledgeInput {
  speciesId: UUID!
  knowledgeType: KnowledgeType!
  traditionalUse: String!
  preparationMethod: String
  seasonalTiming: String
  spiritualContext: String
  knowledgeHolder: String
  communitySource: String
  documentationDate: Date
  sensitivityLevel: SensitivityLevel!
  fpicStatus: FPICStatus
  fpicDocumentation: String
  publicAccess: Boolean!
  commercialUseAllowed: Boolean!
  usageRestrictions: String!
  culturalSignificance: CulturalSignificance
}

input ProposalInput {
  proposalTitle: String!
  proposalType: String!
  description: String!
  fundingRequestedUsd: Float
  targetSpeciesIds: [UUID!]
  targetEcosystemIds: [UUID!]
  beneficiaryCommunities: [String!]
  votingDurationDays: Int!
  proposerAddress: String!
  proposerName: String
}

enum VoteType {
  FOR
  AGAINST
  ABSTAIN
}

# =====================================================
# SUBSCRIPTION ROOT
# =====================================================

type Subscription {
  # Real-time observation updates
  observationAdded(speciesId: UUID): Observation!

  # Conservation action updates
  conservationActionUpdated(ecosystemId: UUID): ConservationAction!

  # DAO proposal updates
  proposalStatusChanged(proposalId: UUID): DAOProposal!
  newProposal: DAOProposal!

  # Token rewards
  rewardClaimed(walletAddress: String!): ConservationReward!

  # Population alerts
  populationAlert(speciesId: UUID): PopulationAlert!
}

type PopulationAlert {
  species: Species!
  alertType: String!
  message: String!
  timestamp: DateTime!
}

# =====================================================
# DIRECTIVES
# =====================================================

directive @auth(
  requires: [Role!]!
) on FIELD_DEFINITION

directive @fpic(
  required: Boolean!
) on FIELD_DEFINITION

directive @rateLimit(
  limit: Int!
  window: String!
) on FIELD_DEFINITION

enum Role {
  PUBLIC
  CONTRIBUTOR
  RESEARCHER
  CULTURAL_GUARDIAN
  ADMIN
}

# =====================================================
# SCHEMA DOCUMENTATION
# =====================================================

"""
Borikén Biodiversity GraphQL API

This API provides access to comprehensive biodiversity data for Puerto Rico
(Borikén in Taíno language) with cultural protocols, justice framework analysis,
and web3 integration.

## Cultural Protocols

All cultural knowledge is protected by Free, Prior, and Informed Consent (FPIC)
protocols. Sacred and restricted knowledge requires special authentication and
community approval.

