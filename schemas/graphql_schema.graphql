# =====================================================
# Borikén Biodiversity Database - GraphQL Schema
# =====================================================
# Version: 1.0.0
# Last Updated: 2025-11-05
# Description: Comprehensive GraphQL schema for Puerto Rico's biodiversity API
#              with cultural protocols, justice framework, and web3 integration
# =====================================================

# =====================================================
# SCALAR TYPES
# =====================================================

scalar DateTime
scalar Date
scalar JSON
scalar Geography  # GeoJSON format
scalar UUID

# =====================================================
# ENUMS
# =====================================================

enum EndemicStatus {
  ENDEMIC_PUERTO_RICO
  ENDEMIC_CARIBBEAN
  NATIVE
  INTRODUCED
  INVASIVE
  VAGRANT
}

enum ConservationStatus {
  EXTINCT
  EXTINCT_IN_WILD
  CRITICALLY_ENDANGERED
  ENDANGERED
  VULNERABLE
  NEAR_THREATENED
  LEAST_CONCERN
  DATA_DEFICIENT
  NOT_EVALUATED
}

enum PopulationTrend {
  INCREASING
  STABLE
  DECREASING
  UNKNOWN
  EXTINCT
}

enum EcosystemType {
  TROPICAL_RAINFOREST
  SUBTROPICAL_DRY_FOREST
  SUBTROPICAL_MOIST_FOREST
  MANGROVE
  CORAL_REEF
  SEAGRASS_MEADOW
  CAVE_SYSTEM
  CLOUD_FOREST
  COASTAL_SCRUB
  WETLAND
  FRESHWATER_STREAM
  LAGOON
  AGRICULTURAL
  URBAN
}

enum ProtectionStatus {
  NATIONAL_FOREST
  NATIONAL_WILDLIFE_REFUGE
  STATE_FOREST
  UNESCO_BIOSPHERE_RESERVE
  MARINE_PROTECTED_AREA
  CRITICAL_HABITAT
  PRIVATE_CONSERVATION
  UNPROTECTED
}

enum CulturalSignificance {
  VERY_HIGH
  HIGH
  MODERATE
  LOW
}

enum KnowledgeType {
  MEDICINAL
  CEREMONIAL
  FOOD
  CRAFT
  SPIRITUAL
  ECOLOGICAL
  ASTRONOMICAL
  SEASONAL
  NAVIGATION
  SYMBOLIC
}

enum SensitivityLevel {
  PUBLIC
  COMMUNITY_ONLY
  SACRED
  RESTRICTED
}

enum FPICStatus {
  CONSENT_GRANTED
  CONSENT_PENDING
  CONSENT_DENIED
  NOT_REQUIRED
}

enum ThreatCategory {
  HABITAT_LOSS
  HABITAT_DEGRADATION
  INVASIVE_SPECIES
  CLIMATE_CHANGE
  POLLUTION
  OVERHARVESTING
  DISEASE
  PREDATION
  HUMAN_DISTURBANCE
  NATURAL_DISASTERS
  GENETIC_FACTORS
}

enum Severity {
  CRITICAL
  HIGH
  MODERATE
  LOW
  UNKNOWN
}

enum ActionType {
  HABITAT_PROTECTION
  HABITAT_RESTORATION
  SPECIES_RECOVERY
  CAPTIVE_BREEDING
  REINTRODUCTION
  INVASIVE_CONTROL
  RESEARCH
  MONITORING
  EDUCATION
  POLICY
  COMMUNITY_BASED
  TRADITIONAL_PRACTICES
}

enum HabitatPreference {
  PRIMARY
  SECONDARY
  OCCASIONAL
  RARE
}

enum LifeStage {
  ADULT
  JUVENILE
  LARVA
  EGG
  SEEDLING
  UNKNOWN
}

enum Sex {
  MALE
  FEMALE
  UNKNOWN
}

enum FloodRisk {
  EXTREME
  HIGH
  MODERATE
  LOW
}

enum DataQuality {
  VERIFIED
  PRELIMINARY
  UNVERIFIED
  DISPUTED
}

# =====================================================
# TAXONOMY & SPECIES TYPES
# =====================================================

type Taxonomy {
  id: ID!
  kingdom: String!
  phylum: String
  class: String
  order: String
  family: String
  genus: String
  species: String
  subspecies: String
  scientificName: String!
  authority: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Species {
  id: UUID!
  taxonomy: Taxonomy!
  commonName: String
  commonNameSpanish: String
  tainoName: String
  tainoEtymology: String

  # Endemic and conservation status
  endemicStatus: EndemicStatus
  conservationStatus: ConservationStatus
  conservationStatusDate: Date

  # Description
  description: String
  physicalDescription: String
  behavior: String
  diet: String
  reproduction: String
  lifespanYearsMin: Float
  lifespanYearsMax: Float

  # Size metrics
  sizeLengthCmMin: Float
  sizeLengthCmMax: Float
  sizeWingspanCmMin: Float
  sizeWingspanCmMax: Float
  sizeWeightGMin: Float
  sizeWeightGMax: Float

  # Population data
  populationEstimateMin: Int
  populationEstimateMax: Int
  populationEstimateYear: Int
  populationTrend: PopulationTrend
  populationHistory: [PopulationHistory!]!

  # Relationships
  habitats: [SpeciesHabitat!]!
  observations: [Observation!]!
  culturalKnowledge: [CulturalKnowledge!]!
  threats: [SpeciesThreat!]!

  # References
  primaryReference: String
  iucnLink: String
  gbifId: String

  # Web3 metadata
  nftReady: Boolean!
  rarityScore: Float
  culturalValue: Float
  ecologicalValue: Float
  nftMetadata: NFTMetadata

  # Metadata
  dataQuality: DataQuality!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type SpeciesCommonName {
  id: ID!
  species: Species!
  commonName: String!
  language: String!
  isPrimary: Boolean!
  region: String
  createdAt: DateTime!
}

type PopulationHistory {
  id: ID!
  species: Species!
  year: Int!
  populationEstimate: Int
  populationMin: Int
  populationMax: Int
  wildPopulation: Int
  captivePopulation: Int
  methodology: String
  dataSource: String
  confidenceLevel: String
  notes: String
  createdAt: DateTime!
}

type PopulationTrendData {
  year: Int!
  population: Int!
  percentChange: Float
}

# =====================================================
# HABITATS & ECOSYSTEMS
# =====================================================

type Ecosystem {
  id: UUID!
  name: String!
  nameSpanish: String
  tainoName: String
  ecosystemType: EcosystemType!

  # Geographic data
  locationName: String
  geography: Geography
  areaKm2: Float
  elevationMinM: Int
  elevationMaxM: Int

  # Climate data
  annualRainfallMmMin: Int
  annualRainfallMmMax: Int
  temperatureAvgC: Float

  # Biodiversity metrics
  speciesCountTotal: Int
  speciesCountEndemic: Int
  speciesCountThreatened: Int
  speciesList: [Species!]!

  # Description
  description: String
  ecologicalImportance: String
  threats: [String!]

  # Conservation
  protectionStatus: ProtectionStatus
  protectionLevel: String
  managingAgency: String

  # Cultural significance
  culturalSignificance: CulturalSignificance
  sacredSite: Boolean!
  spiritualSignificance: String

  # Conservation actions
  conservationActions: [ConservationAction!]!

  # Metadata
  createdAt: DateTime!
  updatedAt: DateTime!
}

type SpeciesHabitat {
  id: ID!
  species: Species!
  ecosystem: Ecosystem!
  habitatPreference: HabitatPreference
  breedingHabitat: Boolean!
  feedingHabitat: Boolean!
  seasonal: Boolean!
  season: String
  notes: String
  createdAt: DateTime!
}

type Observation {
  id: UUID!
  species: Species!
  location: Geography!
  observationDate: Date!
  observationTime: String
  observerName: String
  observerEmail: String

  # Observation details
  individualCount: Int
  lifeStage: LifeStage
  sex: Sex
  behaviorObserved: String

  # Verification
  verified: Boolean!
  verifiedBy: String
  verifiedDate: Date

  # Media
  hasPhoto: Boolean!
  hasAudio: Boolean!
  mediaUrls: [String!]

  # Citizen science
  projectName: String
  observationPlatform: String
  externalId: String

  createdAt: DateTime!
  updatedAt: DateTime!
}

# =====================================================
# CULTURAL KNOWLEDGE & TRADITIONAL USE
# =====================================================

type CulturalKnowledge {
  id: UUID!
  species: Species!

  # Knowledge content
  knowledgeType: KnowledgeType!
  traditionalUse: String!
  preparationMethod: String
  seasonalTiming: String
  spiritualContext: String
  taboosRestrictions: String

  # Attribution & sovereignty
  knowledgeHolder: String
  communitySource: String
  elderName: String
  documentationDate: Date

  # Cultural protocols (FPIC compliance)
  sensitivityLevel: SensitivityLevel!
  fpicStatus: FPICStatus
  fpicDocumentation: String
  communityApprovalStatus: String
  elderConsultationComplete: Boolean!

  # Access control
  publicAccess: Boolean!
  commercialUseAllowed: Boolean!
  attributionRequired: Boolean!
  benefitSharingAgreement: String

  # Usage restrictions
  usageRestrictions: String!
  prohibitedUses: [String!]
  requiredProtocols: [String!]

  # Metadata
  culturalSignificance: CulturalSignificance
  historicalContinuity: Boolean
  endangermentStatus: String

  createdAt: DateTime!
  updatedAt: DateTime!
}

type EcologicalCalendar {
  id: ID!
  eventName: String!
  eventNameTaino: String
  eventType: String!

  # Timing
  startMonth: Int!
  endMonth: Int!
  lunarPhase: String

  # Related species
  primarySpecies: Species
  relatedSpecies: [Species!]

  # Traditional knowledge
  traditionalSignificance: String
  contemporaryRelevance: String

  createdAt: DateTime!
}

# =====================================================
# CONSERVATION & THREATS
# =====================================================

type Threat {
  id: ID!
  threatName: String!
  threatCategory: ThreatCategory!
  description: String
  mitigationStrategies: String
  createdAt: DateTime!
}

type SpeciesThreat {
  id: ID!
  species: Species!
  threat: Threat!
  severity: Severity!
  trend: PopulationTrend
  specificDetails: String
  geographicScope: String
  firstDocumented: Date
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ConservationAction {
  id: UUID!
  actionName: String!
  actionType: ActionType!

  # Scope
  targetSpecies: [Species!]!
  targetEcosystems: [Ecosystem!]
  geographicArea: Geography

  # Implementation
  implementingOrganization: String
  partnerOrganizations: [String!]
  communityInvolvement: Boolean!
  indigenousLeadership: Boolean!

  # Timeline
  startDate: Date
  endDate: Date
  ongoing: Boolean!

  # Funding
  totalBudgetUsd: Float
  fundingSources: [String!]

  # Results
  successMetrics: String
  resultsSummary: String
  effectiveness: String

  # References
  projectUrl: String
  reports: [String!]

  createdAt: DateTime!
  updatedAt: DateTime!
}

type InvasiveSpecies {
  id: ID!
  species: Species!
  originRegion: String
  introductionDateMin: Int
  introductionDateMax: Int
  introductionPathway: String

  # Impact assessment
  ecologicalImpact: Severity
  economicImpactUsd: Float
  humanHealthImpact: Boolean!

  # Distribution
  currentDistributionAreaKm2: Float
  spreadRate: String

  # Native species affected
  nativeSpeciesAffected: [Species!]
  ecosystemsAffected: [Ecosystem!]

  # Control efforts
  controlMethods: [String!]
  controlEffectiveness: String
  eradicationFeasible: Boolean

  createdAt: DateTime!
  updatedAt: DateTime!
}

# =====================================================
# JUSTICE FRAMEWORK
# =====================================================

type EnvironmentalJusticeCommunity {
  id: UUID!
  communityName: String!
  communityNameSpanish: String
  municipality: String

  # Geographic
  location: Geography!
  boundary: Geography

  # Demographics
  population: Int
  medianIncomeUsd: Int
  povertyRate: Float
  unemploymentRate: Float
  percentMinority: Float
  percentBlack: Float
  percentIndigenous: Float

  # Environmental burdens
  pollutionSources: [String!]
  superfundSites: Boolean!
  coalAshExposure: Boolean!
  landfillProximityKm: Float
  industrialFacilityCount: Int

  # Health impacts
  asthmaRate: Float
  cancerCluster: Boolean!
  environmentalHealthIssues: [String!]

  # Climate vulnerability
  floodRisk: FloodRisk
  hurricaneVulnerability: String
  heatIslandEffect: Boolean!
  seaLevelRiseRisk: Boolean!

  # Infrastructure
  waterQualityIssues: Boolean!
  powerGridReliability: String
  averagePowerOutageHoursYearly: Int

  # Hurricane Maria impact
  mariaDamageLevel: String
  mariaRecoveryStatus: String
  daysWithoutPowerPostMaria: Int

  # Classification
  sacrificeZone: Boolean!
  environmentalJusticePriority: Boolean!

  # Resistance & resilience
  communityOrganizingActive: Boolean!
  organizingGroups: [String!]
  renewableEnergyProjects: [String!]
  communityResilienceInitiatives: [String!]

  createdAt: DateTime!
  updatedAt: DateTime!
}

type FoodSystem {
