# =====================================================
# WEB3 & BLOCKCHAIN INTEGRATION
# =====================================================

type NFTMetadata {
  id: UUID!
  species: Species!

  # NFT details
  tokenStandard: String!
  contractAddress: String
  tokenId: String
  blockchain: String!

  # Metadata
  name: String!
  description: String!
  imageUrl: String
  externalUrl: String
  animationUrl: String

  # Attributes
  attributes: JSON!

  # Cultural protocol
  culturalAttribution: String!
  usageRestrictions: String!
  communityBenefitPercentage: Float!
  royaltyRecipients: [String!]

  # Values
  rarityScore: Float
  culturalSignificanceScore: Float
  conservationPriorityScore: Float

  # Minting status
