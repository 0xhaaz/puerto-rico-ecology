  agroecologicalFarms: Int
  traditionalCrops: [String!]

  # Food access
  foodDesert: Boolean!
  supermarketAccessKm: Float
  farmersMarketsCount: Int

  # Food security metrics
  foodInsecurityRate: Float
  snapParticipationRate: Float

  # Projects
  foodSovereigntyInitiatives: [String!]
  urbanAgricultureProjects: Int
  communityGardens: Int
  seedSavingNetworks: Boolean!

  createdAt: DateTime!
  updatedAt: DateTime!
}

type EconomicEcology {
  id: ID!
  metricName: String!
  metricCategory: String!

  # Value metrics
