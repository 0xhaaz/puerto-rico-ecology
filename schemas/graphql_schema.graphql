type EducationalResource {
  id: UUID!
  title: String!
  resourceType: String!

  # Target audience
  audience: String!
  gradeLevel: String

  # Content
  description: String
  learningObjectives: [String!]
  topics: [String!]

  # Related content
  relatedSpecies: [Species!]
  relatedEcosystems: [Ecosystem!]

