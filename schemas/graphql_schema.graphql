  updatedAt: DateTime!
}

type ConservationReward {
  id: UUID!
  userWalletAddress: String!

  # Action
  actionType: String!
  actionDescription: String

  # Related entities
  species: Species
  ecosystem: Ecosystem
  observation: Observation

  # Reward
  tokenAmount: Float!
  tokenSymbol: String!
