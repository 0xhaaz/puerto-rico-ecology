  valuePerCapitaUsd: Float
  measurementYear: Int

  # Beneficiary analysis
  primaryBeneficiaries: String
  communityBenefitPercentage: Float
  corporateBenefitPercentage: Float

  # Geographic scope
  municipality: String
  ecosystem: Ecosystem

  description: String
  dataSource: String

  createdAt: DateTime!
}

type RightsOfNatureProposal {
  id: UUID!
  proposalName: String!
  ecosystem: Ecosystem

  # Legal framework
  proposedRights: [String!]!
  legalPersonhood: Boolean!
  guardianEntity: String

  # Status
