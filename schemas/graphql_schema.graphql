  targetEcosystems: [Ecosystem!]
  beneficiaryCommunities: [String!]

  # Voting
  votingStart: DateTime!
  votingEnd: DateTime!
  quorumRequired: Float
  votesFor: Int!
  votesAgainst: Int!
  votesAbstain: Int!

  # Status
  status: String!

  # Execution
  executionDate: DateTime
  transactionHash: String

  # Proposer
  proposerAddress: String!
  proposerName: String

  createdAt: DateTime!
  updatedAt: DateTime!
}

# =====================================================
# RESEARCH & EDUCATION
# =====================================================

type ResearchProject {
  id: UUID!
  projectName: String!
  projectType: String!

  # Scope
